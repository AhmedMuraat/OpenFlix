version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "18:00"
      timezone: Europe/Amsterdam
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/openflix-web
    schedule:
      interval: weekly
      day: monday
      time: "18:00"
      timezone: Europe/Amsterdam
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "18:00"
      timezone: Europe/Amsterdam
