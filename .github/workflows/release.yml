name: Release and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            file: src/OpenFlix.Gateway/Dockerfile
            context: .
          - name: identity
            file: src/OpenFlix.Identity/Dockerfile
            context: .
          - name: catalog
            file: src/OpenFlix.Catalog/Dockerfile
            context: .
          - name: subscriptions
            file: src/OpenFlix.Subscriptions/Dockerfile
            context: .
          - name: web
            file: src/openflix-web/Dockerfile
            context: src/openflix-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/openflix-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/openflix
          chmod 600 ~/.ssh/openflix
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment definition
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: scp -i ~/.ssh/openflix deploy/compose.yml "$OCI_USER@$OCI_HOST:~/openflix-compose.yml"
      - name: Roll out
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          ENV_FILE=$(printf '%s' \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_KEY=$JWT_KEY
          INTERNAL_API_KEY=$INTERNAL_API_KEY
          OCI_HOST=$OCI_HOST
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
          STRIPE_PRICE_ID=$STRIPE_PRICE_ID" | base64 -w0)
          ssh -i ~/.ssh/openflix "$OCI_USER@$OCI_HOST" \
            "printf '%s' '$ENV_FILE' | base64 -d > ~/openflix.env && chmod 600 ~/openflix.env && docker compose --env-file ~/openflix.env -f ~/openflix-compose.yml pull && docker compose --env-file ~/openflix.env -f ~/openflix-compose.yml up -d --remove-orphans"
