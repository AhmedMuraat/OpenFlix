name: Release and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            file: src/OpenFlix.Gateway/Dockerfile
            context: .
          - name: identity
            file: src/OpenFlix.Identity/Dockerfile
            context: .
          - name: catalog
            file: src/OpenFlix.Catalog/Dockerfile
            context: .
          - name: subscriptions
            file: src/OpenFlix.Subscriptions/Dockerfile
            context: .
          - name: web
            file: src/openflix-web/Dockerfile
            context: src/openflix-web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/openflix-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger production rollout
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --retry 3 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}"}'
